spring:
  datasource:
    url: jdbc:h2:mem:jobradar;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        order_by.default_null_ordering: last
  flyway:
    enabled: true

jobradar:
  owner:
    username: boris
    password: test-password
  timezone: Europe/Vienna
  pipeline:
    cron: "-"
    enabled: false
    max-ai-per-run: 10
  ai:
    api-key: ""
    match-model: claude-haiku-5-5
    letter-model: claude-sonnet-5-5
    monthly-budget-usd: 5
  telegram:
    bot-token: ""
    chat-id: ""
  public-url: http://localhost

logging:
  file:
    name: target/test.log
